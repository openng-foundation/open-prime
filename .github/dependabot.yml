version: 2
updates:
    # Check Node.js packages
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
      open-pull-requests-limit: 20
      groups:
          angular:
              patterns:
                  - "@angular/*"
                  - "@angular-devkit/*"

    # Check GitHub Actions workflows
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 20
